server:
  # Matches the Dockerfile EXPOSE / docker-compose port mapping and the README examples.
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: pad-liveness-backend

  # ---- PostgreSQL ----
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pad_liveness}
    username: ${POSTGRES_USER:mosip}
    password: ${POSTGRES_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway manages schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ---- Flyway (replaces Alembic) ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ---- Jackson ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ---- MOSIP Liveness Engine ----
mosip:
  liveness:
    passive-threshold: 0.80
    min-face-quality: 0.50
    passive-min-frames: 5
    passive-window-frames: 7
    min-challenge-count: 2
    challenge-timeout-ms: 10000
    max-retries: 2

# ---- Logging ----
logging:
  level:
    root: INFO
    io.mosip.liveness: INFO
    org.flywaydb: INFO
