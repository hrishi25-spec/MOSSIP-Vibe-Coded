def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "io.mosip.registration.livenessclient"
    compileSdkVersion 34
    buildToolsVersion '34.0.0'
    ndkVersion '25.1.8937393'

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java {
            srcDirs += ['src/main/kotlin', '../../../src/main/java']
            include 'io/mosip/registration/liveness/**'
            include 'io/mosip/registration/livenessclient/**'
            include 'io/mosip/liveness/android/**'
            include 'io/mosip/liveness/core/**'
            include 'io/mosip/liveness/engine/**'
            include 'io/mosip/liveness/challenge/**'
            include 'io/mosip/liveness/config/EffectivePolicy.java'
            include 'io/mosip/liveness/config/LivenessConfig.java'
            include 'io/mosip/liveness/config/WorkflowPolicyDefaults.java'
            include 'io/mosip/liveness/audit/AuditEvent.java'
            include 'io/mosip/liveness/audit/AuditEventType.java'
            include 'io/mosip/liveness/audit/AuditLogger.java'
            include 'io/mosip/liveness/audit/MetricsCollector.java'
            include 'io/mosip/liveness/backend/LivenessBackend.java'
            include 'io/mosip/liveness/diagnostics/DiagnosticsSnapshot.java'
            include 'io/mosip/liveness/dto/FrameProcessResult.java'
            include 'io/mosip/liveness/models/enums/LivenessStage.java'
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "io.mosip.registration.livenessclient"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 28
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.camera:camera-camera2:1.3.0'
    implementation 'androidx.camera:camera-core:1.3.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    compileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}
