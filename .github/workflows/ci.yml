name: CI

# Unit and integration suites run as two parallel jobs. Both jobs share the
# same checkout/JDK setup; the suite split is a surefire -Dtest filter, so no
# extra plugins or pom changes are needed.
on:
  push:
    # Every branch push runs the suites and builds the jar. Tag pushes (v*)
    # additionally publish a GitHub Release with the jar attached.
    branches: ['**']
    tags: ['v*']
  # Branches get the identical gate before merging — unit + integration
  # suites, the PostgreSQL schema gate, the console DOM tests and both jar
  # builds. A pull request publishes nothing: the upload step below is guarded
  # on event type, ref and default branch, so no fork can write to storage.
  pull_request:

# Least privilege by default: the workflow only needs to read the repo. The
# release job overrides this with contents: write, scoped to that one job.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Run both to completion — a unit failure must not cancel the
      # integration run (and vice versa); both results are wanted.
      fail-fast: false
      matrix:
        include:
          - suite: Unit
            maven_tests: "!LivenessPipelineIntegrationTest,!PostgresSchemaTest"
          - suite: Integration
            maven_tests: "LivenessPipelineIntegrationTest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 matches <java.version> in pom.xml; cache: maven keeps the
      # dependency cache (~/.m2/repository) between runs so CI stays fast.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Tests are self-contained: the JPA slice swaps in embedded H2, OpenCV
      # natives and the ONNX model ship inside the dependency jars, so no
      # database or external service is needed on the runner. The single
      # quotes keep the surefire '!' exclusion literal for the shell.
      - name: Run ${{ matrix.suite }} tests
        run: ./mvnw --batch-mode test -Dtest='${{ matrix.maven_tests }}'

  # The console is plain browser JS with no build step, so its guards live
  # outside Maven entirely: a green Java suite says nothing about whether
  # src/main/resources/static is still wired. This runs the DOM harness that
  # executes the real index.html + console.js and drives the dirty marker,
  # the per-field diff, the discard guard and the unload warnings.
  console:
    name: Console DOM tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No setup-node and no npm install: the harness is deliberately
      # dependency-free, and ubuntu-latest ships a node binary on PATH.
      - name: Run the console guard tests
        run: node src/test/js/console-guards.test.mjs

  # Packages the executable jars, but only after the suites passed (needs: test
  # waits for every matrix leg, and console waits for the DOM guards), so a red
  # build never publishes an artifact.
  #
  # Two legs, in parallel. The full jar is the deployable artifact — natives
  # for every platform. The slim jar is the same application with only the
  # linux-x86_64 natives a Linux runner can load anyway, which is why it is a
  # fraction of the payload. Building both means storage holds the small one
  # without anyone losing the fully runnable build.
  #
  # Runs on tag pushes too, not only branch pushes: the upload below is what
  # gives a release tag a versioned artifact independent of whichever branch
  # happens to be the default. The release job further down separately attaches
  # the full jar to the GitHub Release.
  package:
    name: Package ${{ matrix.artifact }} jar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test, console]
    strategy:
      # Both legs run to completion — one packaging path failing must not hide
      # the other's result.
      fail-fast: false
      matrix:
        include:
          - artifact: full
            profile: ''
            jar: target/pad-liveness-backend-*.jar
            # The historical name goes to the slim build — it is what CI, the
            # Docker image and most deployments actually run, and it is the
            # small one. The cross-platform jar stays one click away under its
            # own name for macOS/Windows consumers.
            artifact_name: pad-liveness-backend-full-jar
            smoke_jar: full
            # ~200 MiB today; the ceiling leaves ~20% for a patch release but
            # trips the moment a whole extra platform (~50-100 MB) sneaks back.
            max_mib: 245
          # `clean` is not optional for this leg: the slim profile unpacks the
          # kept natives into target/classes, which repackage embeds verbatim,
          # so a non-clean build could leave linux-only natives in the full jar.
          - artifact: slim
            profile: '-Pslim'
            jar: target/pad-liveness-backend-*-slim.jar
            artifact_name: pad-liveness-backend-jar
            smoke_jar: slim
            max_mib: 110
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Tests already ran in the test jobs, so skip them here; spring-boot
      # repackage turns the build output into the runnable fat jar.
      - name: Package the ${{ matrix.artifact }} jar
        run: ./mvnw --batch-mode clean package -DskipTests ${{ matrix.profile }}

      # Boot the jar we just built and prove it serves traffic. The test jobs
      # run against target/classes with the full ~/.m2 classpath, so nothing
      # they do can catch a packaging-only regression — a fat jar that lost its
      # OpenCV natives, a wrong Start-Class (spring-boot writes JarLauncher
      # itself when a <classifier> is set, and the loader then re-launches until
      # StackOverflowError), a truncated repackage all ship green and only break
      # for whoever runs the artifact.
      #
      # Both legs boot and must report `engine: available`. That is the point
      # of running it for the slim jar too: nothing else in this workflow can
      # tell a working -Pslim build from one whose native filter quietly stopped
      # matching, and that failure ships as a jar that boots fine and then
      # rejects every frame.
      #
      # Deliberately not branch-gated (unlike the upload below): this is the
      # check that makes gating the upload safe to begin with.
      #
      # Lives in a script, not inline, because the release job runs it too and
      # it is runnable locally with ./scripts/smoke-jar.sh (SMOKE_JAR=full|slim).
      - name: Smoke test the packaged jar
        env:
          SMOKE_JAR: ${{ matrix.smoke_jar }}
        run: ./scripts/smoke-jar.sh

      # A jar that outgrows its budget is a regression nobody else notices: the
      # build is still green, every download is just slower, and artifact
      # storage quietly doubles. Red here, on the run that caused it.
      - name: Enforce jar size ceiling
        run: ./scripts/check-jar-size.sh '${{ matrix.jar }}' ${{ matrix.max_mib }} '${{ matrix.artifact }} jar'

      # Both legs report, so the run summary shows the pair on every build and a
      # payload that creeps up over months is visible in the history rather than
      # being discovered when storage fills.
      - name: Report jar size
        run: |
          BYTES=$(wc -c < ${{ matrix.jar }})
          HUMAN=$(numfmt --to=iec --suffix=B "$BYTES" 2>/dev/null || echo "$BYTES bytes")
          {
            echo "### ${{ matrix.artifact }} jar — $HUMAN"
            echo
            echo "Artifact: \`${{ matrix.artifact_name }}\` · budget ${{ matrix.max_mib }} MiB"
          } >> "$GITHUB_STEP_SUMMARY"

      # Publishes on the default branch and on v* tags: a versioned artifact
      # must not depend on which branch is the default. Pull requests build
      # both jars but never write to the repo's artifact storage.
      #
      # Two artifact names rather than one shared name: upload-artifact v4
      # treats a name as immutable across jobs, so a second matrix leg
      # uploading under the same name fails with 409 and takes the whole job
      # with it. Each glob matches exactly one file for its leg — the
      # classifier-less fat jar, and the -slim classifier respectively.
      #
      # They are ~210 MB and ~94 MB (bundled OpenCV natives + ONNX model), so
      # retention is kept short to stay inside the artifact storage quota.
      - name: Upload jar
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.jar }}
          if-no-files-found: error
          retention-days: 7

  # The image is a separate delivery path from the jar: the Dockerfile's COPY,
  # its Alpine base, the unprivileged user and the JVM flags exist nowhere else
  # in this repository, so no other job can see a mistake in any of them. Builds
  # from the slim profile and boots the container against /health.
  #
  # It packages its own slim jar rather than downloading the package job's
  # artifact: that upload is deliberately branch-gated, so on a pull request
  # there would be nothing to download and the check would silently skip.
  #
  # The container assertion is `status: ok`, not `engine: available` — Alpine is
  # musl and the OpenCV native is glibc-linked, so a correct image serves the API
  # with frame processing unavailable by design. The engine assertion lives in
  # the jar smoke tests, which run on glibc.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package the slim jar the image is built from
        run: ./mvnw --batch-mode clean package -DskipTests -Pslim

      - name: Build the image and smoke test the container
        run: ./scripts/smoke-docker.sh

  # The schema gate — the only job that compares the entities against the Flyway
  # migrations on the database that actually ships.
  #
  # Everything else in this workflow runs on H2 with ddl-auto: create-drop, so
  # Hibernate builds the schema *from the entities* and Flyway never runs. That
  # hides a whole class of drift: a column an entity declares but no migration
  # creates, a column too narrow for the values, an enum stored as a number.
  # Green CI, broken production — while production is PostgreSQL, the one
  # database never exercised.
  #
  # A service container rather than Testcontainers: the PostgreSQL JDBC driver
  # and flyway-database-postgresql are already dependencies, so this adds no new
  # test libraries. It runs in parallel with the suites rather than after them —
  # it is an independent concern and gives a fast signal.
  schema:
    name: PostgreSQL schema gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mosip
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: pad_liveness
        ports:
          - 5432:5432
        # Fail fast if Postgres never comes up, instead of timing out the job
        # on a connection that was never going to work.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Opt-in switch read by @EnabledIfEnvironmentVariable, plus the same
      # POSTGRES_* variables application.yml already reads — the test uses the
      # production datasource configuration, not a test-only one.
      MOSIP_PG_TEST: 'true'
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: mosip
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: pad_liveness
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate migrations against the entities
        run: ./mvnw --batch-mode test -Dtest='PostgresSchemaTest'

  # Pushing a version tag (v*) publishes the jar to a GitHub Release. This is
  # the deliberate, human-initiated publish event — unlike the per-push artifact
  # upload, which is ephemeral and branch-gated.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # Scoped to this job alone: the rest of the workflow stays read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Release assets are the same artifact CI publishes elsewhere, so they go
      # through the identical gate: green tests, then a real boot.
      - name: Package
        run: ./mvnw --batch-mode -DskipTests package

      - name: Smoke test the packaged jar
        run: ./scripts/smoke-jar.sh

      # `gh release create` fails if the release already exists, which is what a
      # re-pushed or moved tag looks like. Upload --clobber replaces the asset
      # in that case, so a retried run converges instead of wedging. GH_TOKEN is
      # the automatic per-run token, so there is no secret to configure or leak.
      - name: Attach jar to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          JAR=$(ls target/pad-liveness-backend-*.jar | grep -v -- '-slim\.jar$')

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — replacing the asset"
            gh release upload "$TAG" "$JAR" --clobber
          else
            # No --notes-start-tag: it errors when there is no previous release,
            # which would make the very first tag unpublishable. Plain
            # --generate-notes picks the previous release automatically when
            # one exists and starts from scratch when it does not.
            gh release create "$TAG" "$JAR" \
              --title "$TAG" \
              --generate-notes
          fi
