version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pad_liveness_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mosip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-pad_liveness}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mosip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: pad_liveness_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pad_liveness}
      POSTGRES_USER: ${POSTGRES_USER:-mosip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "8000:8000"
    command: java -jar /app/app.jar --spring.profiles.active=default

volumes:
  pg_data:
